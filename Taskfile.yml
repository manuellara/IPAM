version: '3'

vars:
  BIN_DIR: '.bin'
  MIGRATE_BIN: '{{.BIN_DIR}}/migrate'
  SQLITE_DB: 'ipam.db'

tasks:

  setup-migrate:
    internal: true
    desc: Installs golang-migrate strictly inside this project directory
    status:
      - test -f {{.MIGRATE_BIN}}
    cmds:
      - mkdir -p {{.BIN_DIR}}
      # GOBIN isolates the binary destination, ensuring your system remains untouched
      - GOBIN={{.USER_WORKING_DIR}}/{{.BIN_DIR}} CGO_ENABLED=1 go install -tags 'sqlite3' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

  migrate-create:
    desc: Create database migration with SQL extension and sequence naming convention
    cmds:
      - migrate create -ext sql -dir ./migrations -seq {{.NAME}}
    requires:
      vars: [NAME]

  migrate-up:
    desc: Run database migrations up
    deps: [setup-migrate]
    cmds:
      - "{{.MIGRATE_BIN}} -database 'sqlite3://{{.SQLITE_DB}}' -path ./migrations up"

  migrate-down:
    desc: Rollback database migrations
    deps: [setup-migrate]
    cmds:
      - "{{.MIGRATE_BIN}} -database 'sqlite3://{{.SQLITE_DB}}' -path ./migrations down"

  sqlc-generate:
    desc: Generate Go code from SQL queries using sqlc
    cmds:
      - sqlc generate

  templ-generate:
    desc: Regenerate cmd/views/*_templ.go from .templ source -- commit the output, never hand-edit it
    cmds:
      - templ generate

  run-dev:
    desc: Run the development server
    deps: [templ-generate, sqlc-generate]
    cmds:
      - go run ./cmd/main.go
  
  delete-db:
    desc: Delete the database files
    cmds:
      - rm -f {{.SQLITE_DB}} {{.SQLITE_DB}}-shm {{.SQLITE_DB}}-wal

  ldap-certs:
    desc: Generate a self-signed TLS cert for the local LDAP test server (idempotent)
    status:
      - test -f test/ldap-bootstrap/certs/server.crt
      - test -f test/ldap-bootstrap/certs/server.key
      - test -f test/ldap-bootstrap/certs/ca.crt
    cmds:
      - mkdir -p test/ldap-bootstrap/certs
      - >
        openssl req -x509 -nodes -newkey ec -pkeyopt ec_paramgen_curve:P-384
        -keyout test/ldap-bootstrap/certs/server.key
        -out test/ldap-bootstrap/certs/server.crt
        -days 365 -sha256
        -subj "/CN=localhost"
        -addext "subjectAltName=DNS:localhost"
      - cp test/ldap-bootstrap/certs/server.crt test/ldap-bootstrap/certs/ca.crt

  ldap-up:
    desc: Start the local LDAP test server (generates certs first if missing)
    deps: [ldap-certs]
    cmds:
      - docker compose up -d openldap

  ldap-down:
    desc: Stop and remove the local LDAP test server, including its data volume
    cmds:
      - docker compose down -v openldap

  ldap-logs:
    desc: Tail the local LDAP test server logs
    cmds:
      - docker compose logs -f openldap

  ldap-reset:
    desc: Tear down, wipe generated certs, and start fresh (use if the server gets into a bad state)
    cmds:
      - task: ldap-down
      - rm -rf test/ldap-bootstrap/certs
      - task: ldap-up

  ldap-test:
    desc: Run the LDAP auth tests against the local test server
    deps: [ldap-up]
    cmds:
      - go test ./internal/auth/... -run TestAuthenticateLDAP -v