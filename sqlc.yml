version: "2"
sql:
  - schema: "migrations"
    queries: "internal/db/queries"
    engine: "sqlite"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true